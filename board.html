<!doctype html>
<!-- ЗАГЛУШКА Claude (CL-0). Режим доски делает Codex по docs/contracts.md (CX-7). -->
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Вектор — доска</title>
<style>body{margin:0;font:44px/1.3 system-ui;background:#fff;color:#1d2b25;display:grid;place-items:center;min-height:100vh;text-align:center}
.slide{max-width:1100px;padding:40px}.slide svg{max-width:100%;height:auto;min-width:520px}.frac{display:inline-flex;flex-direction:column;vertical-align:middle;line-height:1.05}.frac span:first-child{border-bottom:3px solid currentColor}.hint{font-size:20px;color:#777;position:fixed;bottom:16px;width:100%}</style>
</head><body><div class="slide" id="s">Нет данных для мини-урока.</div><div class="hint">← → или клик</div>
<script>
let d = null; try { d = JSON.parse(localStorage.getItem('vektor-board') || 'null'); } catch (e) {}
let i = 0; const el = document.getElementById('s');
function show() { if (!d || !d.slides || !d.slides.length) return; const s = d.slides[i];
  el.innerHTML = (i === 0 ? `<h2>${d.title || ''}</h2>` : '') + s.html + (s.question ? `<p>${s.question}</p>` : '')
    + (s.answerHtml ? `<p><button id="a" style="font-size:28px">Показать ответ</button></p><div id="ans" hidden>${s.answerHtml}</div>` : '');
  const a = document.getElementById('a'); if (a) a.onclick = e => { e.stopPropagation(); document.getElementById('ans').hidden = false; }; }
const go = k => { if (!d) return; i = Math.max(0, Math.min(d.slides.length - 1, i + k)); show(); };
addEventListener('keydown', e => { if (e.key === 'ArrowRight') go(1); if (e.key === 'ArrowLeft') go(-1); });
addEventListener('click', () => go(1)); show();
</script></body></html>
