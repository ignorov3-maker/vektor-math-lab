<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Вектор — интерактивный прототип персональной траектории по математике для 5–6 классов">
  <meta name="theme-color" content="#1E7358">
  <title>Вектор — твой путь к пониманию</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231E7358'/%3E%3Cpath d='M9 23 23 9M13 9h10v10' stroke='%23fff' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="skins.css">
</head>
<body>
<aside class="sidebar">
  <a class="brand" href="#home" aria-label="Вектор — на главную">
    <svg class="brand-mark" width="34" height="34" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7"/><path d="M9 23 23 9M13 9h10v10" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span class="brand-text">вектор</span>
  </a>
  <a class="hud" href="#awards" aria-label="Награды">
    <span class="hud-item hud-stars" title="Звёзды"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg><b id="hud-stars">0</b></span>
    <span class="hud-item hud-streak" title="Дней подряд"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 21c-4 0-6.5-2.8-6.5-6.3 0-3.6 3-5.6 3.6-9.2 2.3 1.4 3.5 3.7 3.5 5.8 1-1 1.6-2.4 1.7-3.8 2.4 1.9 4.2 4.5 4.2 7.2 0 3.5-2.5 6.3-6.5 6.3z"/></svg><b id="hud-streak">0</b></span>
  </a>
  <nav aria-label="Разделы">
    <button data-page="home" data-short="Маршрут"><svg viewBox="0 0 24 24"><path d="M4 19 10 13l4 3 6-8"/><path d="M15 8h5v5"/></svg><span>Мой маршрут</span></button>
    <button data-page="map" data-short="Карта"><svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="8" r="2.5"/><circle cx="9" cy="18" r="2.5"/><path d="M8.3 7 15.6 7.6M7 8.3l1.4 7.3M16.6 10 10.8 16"/></svg><span>Карта знаний</span></button>
    <button data-page="diagnostic" data-short="Тест"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg><span>Диагностика</span></button>
    <button data-page="library" data-short="Уроки"><svg viewBox="0 0 24 24"><path d="M5 4h10l4 4v12H5z"/><path d="M9 12h6M9 16h6"/></svg><span>Материалы</span></button>
    <button data-page="awards" data-short="Награды"><svg viewBox="0 0 24 24"><path d="M7 4h10v4a5 5 0 0 1-10 0z"/><path d="M7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4"/><path d="M12 13v4M8 20h8"/></svg><span>Награды</span></button>
    <button data-page="teacher" data-short="Учитель"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Преподавателю</span></button>
    <button data-page="settings" data-short="Профиль"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg><span>Настройки</span></button>
  </nav>
  <div class="profile"><div class="avatar" id="avatar">А</div><div><span id="student-name">Александр</span><small>Математика, 6 класс</small></div></div>
</aside>
<main>
  <header>
    <div class="crumbs">Моё обучение<span>/</span><b id="crumb">Мой маршрут</b></div>
    <span class="badge" title="Демонстрационная версия: данные хранятся только в этом браузере">Прототип</span>
  </header>
  <div id="app" tabindex="-1"></div>
  <footer>
    <span>Вектор — у каждого свой путь к пониманию</span>
    <span>Прогресс хранится только в этом браузере. <button id="reset">Начать заново</button></span>
  </footer>
</main>
<div class="skin-switch" role="group" aria-label="Стиль оформления">
  <span>Стиль</span>
  <button data-skin="notebook" title="Тетрадь" aria-label="Тетрадь"></button>
  <button data-skin="orbit" title="Орбита" aria-label="Орбита"></button>
  <button data-skin="pop" title="Стикеры" aria-label="Стикеры"></button>
  <button data-skin="holo" title="Голограмма" aria-label="Голограмма"></button>
</div>
<script src="content/check.js"></script>
<script src="content/visuals.js"></script>
<script src="content/fractions.js"></script>
<script src="content/adaptive.js"></script>
<script src="content/tutor.js"></script>
<script src="content/game.js"></script>
<div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>
<script src="app.js"></script>
</body>
</html>
