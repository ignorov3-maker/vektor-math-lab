name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Юнит-тесты
        run: |
          node tests/generators.test.js
          node tests/tutor.test.js
          node tests/game.test.js
          node tests/worker.test.mjs
          node tests/rational.test.js
          node tests/stubs.test.js
          node tests/bugs.test.js
          node tests/review.test.js
          node tests/warmup.test.js
          node tests/tone.test.js
          node tests/stories.test.js
          node tests/program.test.js

      - uses: oven-sh/setup-bun@v2
      - name: ИИ-режимы серверной функции
        run: bun tests/ai_modes.test.ts

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Playwright
        run: |
          pip install playwright pypdf
          python -m playwright install --with-deps chromium

      - name: Сервер (PHP + SQLite)
        run: |
          sudo apt-get install -y php-cli php-sqlite3 php-mbstring >/dev/null
          python tests/server_scenarios.py

      - name: Сценарии в браузере
        run: |
          # упавшие проверки — в аннотации, чтобы их было видно без скачивания лога
          run() { c=0; python "tests/$1.py" > "$1.log" 2>&1 || c=$?; cat "$1.log"
            grep -vE '^(OK|ИТОГО|ВСЕГО|$)' "$1.log" | tail -15 | while IFS= read -r l; do [ $c -eq 0 ] || echo "::error title=$1::$l"; done; return $c; }
          run xray_scenario
          run codex_visual
          run tour_scenario
          run e2e_scenarios && grep -q "ИТОГО: \([0-9]*\) из \1$" e2e_scenarios.log
